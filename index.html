<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Translating Bayesian Inference for GPU Architectures</title>
        <meta
            name="description"
            content="Journal club: what makes GPU computing fast, and how sampling algorithms are reshaped to use it"
        />
        <meta name="author" content="Isaac C. F. Wong" />

        <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
        <link rel="stylesheet" href="node_modules/reveal.js/dist/reveal.css" />
        <!-- Theme CSS (change theme here) -->
        <link
            rel="stylesheet"
            href="node_modules/reveal.js/dist/theme/white.css"
            id="theme"
        />
        <link
            rel="stylesheet"
            href="node_modules/reveal.js/dist/plugin/highlight/monokai.css"

    <body>
        <!-- Optional footer shown on every slide. Edit or remove as needed. -->
        <div class="deck-footer">
            Wong | Translating Bayesian Inference for GPU Architectures |
            Journal club · 20 November 2026
        </div>

        <div class="reveal">
            <div class="slides">
                <!--
          Each section loads a Markdown file via reveal.js's built-in data-markdown.
          data-separator splits a file into horizontal slides; the backup file
          uses data-separator-vertical so its slides sit below the last one.
        -->
                <section data-markdown="slides/01-title.md"></section>
                <section
                    data-markdown="slides/02-motivation.md"
                    data-separator="^---$"
                ></section>
                <section
                    data-markdown="slides/03-two-machines.md"
                    data-separator="^---$"
                ></section>
                <section
                    data-markdown="slides/04-inside-a-gpu.md"
                    data-separator="^---$"
                ></section>
                <section
                    data-markdown="slides/05-samplers.md"
                    data-separator="^---$"
                ></section>
                <section
                    data-markdown="slides/06-takeaways.md"
                    data-separator="^---$"
                ></section>
                <section
                    data-markdown="slides/90-backup.md"
                    data-separator="^====$"
                    data-separator-vertical="^---$"
                ></section>
            </div>
        </div>

        <script src="node_modules/reveal.js/dist/reveal.js"></script>
        <script src="node_modules/reveal.js/dist/plugin/notes.js"></script>
        <script src="node_modules/reveal.js/dist/plugin/markdown.js"></script>
        <script src="node_modules/reveal.js/dist/plugin/highlight.js"></script>
        <script src="node_modules/reveal.js/dist/plugin/math.js"></script>
        <script src="node_modules/reveal.js/dist/plugin/search.js"></script>
        <script src="node_modules/reveal.js/dist/plugin/zoom.js"></script>
        <script src="js/custom.js"></script>
        <script src="js/figures.js"></script>

        <script>
            Reveal.initialize({
                controls: true,
                controlsTutorial: true,
                progress: true,
                slideNumber: 'c/t',
                hash: true,
                center: true,
                touch: true,
                width: 1280,
                height: 720,
                margin: 0.075,
                transition: 'fade',
                transitionSpeed: 'default',
                backgroundTransition: 'fade',
                viewDistance: 3,
                mobileViewDistance: 2,
                plugins: [
                    RevealMarkdown,
                    RevealHighlight,
                    RevealNotes,
                    RevealMath.KaTeX,
                    RevealSearch,
                    RevealZoom,
                ],
            }).then(function () {
                GF.start()
            })
        </script>
